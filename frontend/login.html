<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login | ShopPulse</title>

    <style>
        /* CSS Reset & Variables */
        :root {
            --primary: #4f46e5;
            --primary-hover: #4338ca;
            --text-main: #1e293b;
            --text-muted: #64748b;
            --border-color: #cbd5e1;
            --bg-gradient: linear-gradient(135deg, #eef2ff, #f8fafc);
            --error-bg: #fef2f2;
            --error-text: #b91c1c;
            --success-bg: #ecfdf5;
            --success-text: #047857;
        }

        *, *::before, *::after {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: Arial, Helvetica, sans-serif;
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            background: var(--bg-gradient);
            padding: 20px;
        }

        .login-container {
            width: 100%;
            max-width: 420px;
            background: #ffffff;
            padding: 40px;
            border-radius: 16px;
            box-shadow: 0 12px 40px rgba(0, 0, 0, 0.08);
        }

        .logo {
            text-align: center;
            margin-bottom: 30px;
        }

        .logo h1 {
            color: var(--primary);
            font-size: 32px;
            margin-bottom: 8px;
        }

        .logo p {
            color: var(--text-muted);
            font-size: 14px;
        }

        .login-heading {
            margin-bottom: 25px;
        }

        .login-heading h2 {
            font-size: 24px;
            color: var(--text-main);
            margin-bottom: 8px;
        }

        .login-heading p {
            color: var(--text-muted);
            font-size: 14px;
        }

        .form-group {
            margin-bottom: 20px;
        }

        .form-group label {
            display: block;
            color: #334155;
            font-size: 14px;
            font-weight: bold;
            margin-bottom: 8px;
        }

        .form-group input {
            width: 100%;
            padding: 13px 14px;
            border: 1px solid var(--border-color);
            border-radius: 8px;
            font-size: 15px;
            outline: none;
            transition: border-color 0.2s, box-shadow 0.2s;
        }

        .form-group input:focus {
            border-color: var(--primary);
            box-shadow: 0 0 0 3px rgba(79, 70, 229, 0.12);
        }

        .password-wrapper {
            position: relative;
        }

        .password-wrapper input {
            padding-right: 65px;
        }

        .toggle-password {
            position: absolute;
            right: 12px;
            top: 50%;
            transform: translateY(-50%);
            border: none;
            background: transparent;
            color: var(--primary);
            cursor: pointer;
            font-size: 12px;
            font-weight: bold;
        }

        .form-options {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 22px;
            font-size: 13px;
        }

        .remember-me {
            display: flex;
            align-items: center;
            gap: 7px;
            color: #475569;
            cursor: pointer;
        }

        .remember-me input {
            accent-color: var(--primary);
            cursor: pointer;
        }

        a {
            color: var(--primary);
            text-decoration: none;
        }

        a:hover {
            text-decoration: underline;
        }

        .login-button {
            width: 100%;
            padding: 14px;
            border: none;
            border-radius: 8px;
            background: var(--primary);
            color: white;
            font-size: 16px;
            font-weight: bold;
            cursor: pointer;
            transition: background 0.2s;
        }

        .login-button:hover {
            background: var(--primary-hover);
        }

        .login-button:disabled {
            opacity: 0.7;
            cursor: not-allowed;
        }

        .message {
            display: none;
            margin-top: 15px;
            padding: 12px;
            border-radius: 8px;
            font-size: 13px;
            line-height: 1.5;
        }

        .message.error {
            display: block;
            background: var(--error-bg);
            color: var(--error-text);
        }

        .message.success {
            display: block;
            background: var(--success-bg);
            color: var(--success-text);
        }

        .register-link {
            text-align: center;
            margin-top: 25px;
            color: var(--text-muted);
            font-size: 14px;
        }

        .footer {
            text-align: center;
            margin-top: 25px;
            color: #94a3b8;
            font-size: 12px;
        }

        @media (max-width: 480px) {
            .login-container {
                padding: 28px 22px;
            }

            .logo h1 {
                font-size: 28px;
            }
        }
    </style>
</head>
<body>

    <main class="login-container">
        <header class="logo">
            <h1>ShopPulse</h1>
            <p>Your shopping experience starts here.</p>
        </header>

        <section class="login-heading">
            <h2>Welcome back!</h2>
            <p>Enter your details to sign in to your account.</p>
        </section>

        <form id="loginForm" novalidate>
            <div class="form-group">
                <label for="email">Email Address</label>
                <input 
                    type="email" 
                    id="email" 
                    name="email" 
                    placeholder="you@example.com" 
                    autocomplete="email" 
                    required
                >
            </div>

            <div class="form-group">
                <label for="password">Password</label>
                <div class="password-wrapper">
                    <input 
                        type="password" 
                        id="password" 
                        name="password" 
                        placeholder="Enter your password" 
                        autocomplete="current-password" 
                        required
                    >
                    <button 
                        type="button" 
                        class="toggle-password" 
                        id="togglePassword" 
                        aria-label="Show password" 
                        aria-pressed="false"
                    >
                        Show
                    </button>
                </div>
            </div>

            <div class="form-options">
                <label class="remember-me">
                    <input type="checkbox" id="rememberMe">
                    Remember me
                </label>
                <a href="forgot-password.html">Forgot password?</a>
            </div>

            <button type="submit" class="login-button" id="loginButton">
                Sign In
            </button>

            <div 
                id="message" 
                class="message" 
                role="status" 
                aria-live="polite"
            ></div>
        </form>

        <div class="register-link">
            Don't have an account? 
            <a href="register.html">Create an account</a>
        </div>

        <footer class="footer">
            &copy; <span id="year"></span> ShopPulse. All rights reserved.
        </footer>
    </main>

    <script>
        const loginForm = document.getElementById("loginForm");
        const emailInput = document.getElementById("email");
        const passwordInput = document.getElementById("password");
        const togglePassword = document.getElementById("togglePassword");
        const loginButton = document.getElementById("loginButton");
        const message = document.getElementById("message");
        const rememberMeInput = document.getElementById("rememberMe");

        // Set current year dynamically in the footer
        document.getElementById("year").textContent = new Date().getFullYear();

        // Toggle password visibility
        togglePassword.addEventListener("click", () => {
            const isPasswordHidden = passwordInput.type === "password";

            passwordInput.type = isPasswordHidden ? "text" : "password";
            togglePassword.textContent = isPasswordHidden ? "Hide" : "Show";
            togglePassword.setAttribute("aria-label", isPasswordHidden ? "Hide password" : "Show password");
            togglePassword.setAttribute("aria-pressed", String(isPasswordHidden));
        });

        // Submit the login form
        loginForm.addEventListener("submit", async (event) => {
            event.preventDefault();

            message.className = "message";
            message.textContent = "";

            const email = emailInput.value.trim();
            const password = passwordInput.value;
            const rememberMe = rememberMeInput.checked;

            if (!email || !password) {
                message.textContent = "Please enter your email and password.";
                message.className = "message error";
                return;
            }

            loginButton.disabled = true;
            loginButton.textContent = "Signing in...";

            try {
                const response = await fetch("/api/auth/login", {
                    method: "POST",
                    headers: {
                        "Content-Type": "application/json"
                    },
                    body: JSON.stringify({ email, password, rememberMe })
                });

                const data = await response.json().catch(() => ({}));

                if (!response.ok) {
                    throw new Error(data.message || "Login failed. Check your credentials.");
                }

                message.textContent = "Login successful! Redirecting...";
                message.className = "message success";

                setTimeout(() => {
                    window.location.href = "index.html";
                }, 1000);

            } catch (error) {
                message.textContent = error.message || "Unable to connect to the server. Please try again.";
                message.className = "message error";
            } finally {
                loginButton.disabled = false;
                loginButton.textContent = "Sign In";
            }
        });
    </script>
</body>
</html>
